name: Thesis

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PDF
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            biber \
            fonts-ibm-plex \
            fonts-lora \
            texlive-bibtex-extra \
            texlive-fonts-recommended \
            texlive-lang-spanish \
            texlive-latex-extra \
            texlive-luatex \
            texlive-plain-generic

      - name: Build thesis
        run: bash docs/thesis/compile.sh

      - name: Verify PDF
        run: test -s docs/thesis/tfm.pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: tfm-${{ github.sha }}
          path: docs/thesis/tfm.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Add PDF to the website
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp docs/thesis/tfm.pdf docs/tfm.pdf

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Package website
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Publish website and PDF
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
